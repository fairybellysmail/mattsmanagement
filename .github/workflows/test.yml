name: Test Suite (Unit, Build, Playwright)

on:
  push:
    branches:
      - 'aurel/**'
      - 'main'
  pull_request:
    branches:
      - 'aurel/**'
      - 'main'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, Build & Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Install Playwright browsers and OS system dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright browser test suite
        run: npm run test:browser

      - name: Upload Playwright test report & traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
